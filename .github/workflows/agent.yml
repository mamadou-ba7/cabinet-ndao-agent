name: Agent Email Cabinet NDAO

on:
  schedule:
    # Toutes les 30 minutes (heure UTC). GitHub peut décaler de quelques minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # permet aussi de lancer manuellement via le bouton "Run workflow"

# Évite que deux exécutions tournent en même temps
concurrency:
  group: agent-email
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Reconstituer les identifiants Gmail (depuis les secrets)
        run: |
          printf '%s' "${{ secrets.GMAIL_CREDENTIALS_B64 }}" | base64 -d > credentials.json
          printf '%s' "${{ secrets.GMAIL_TOKEN_B64 }}" | base64 -d > token.json

      - name: Lancer l'agent (mode brouillon)
        env:
          AI_BASE_URL: https://cabinet-ndao-ai.openai.azure.com/openai/v1
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: kimi-k26
          GMAIL_LABEL: INBOX
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # Chaque email n'est traité qu'une fois : on ignore ceux déjà enregistrés (gmail_id), sans les marquer « lus »
        run: python main.py --max 10
